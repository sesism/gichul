<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D4374A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="기출 모의고사">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>기출 랜덤 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F9; --sheet:#FFFFFF; --ink:#1B1E25; --ink-2:#4A505C; --pencil:#8B909B;
  --line:#E3E5EA; --omr:#D4374A; --omr-soft:#FBE7EA; --omr-line:#F0B8C0;
  --ok:#1F7A55; --ok-soft:#E3F3EB; --warn:#B26A00; --warn-soft:#FFF2DC;
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14161B; --sheet:#1C1F26; --ink:#ECEEF2; --ink-2:#B4B9C3; --pencil:#858B97; --line:#2C3039; --omr:#FF6B7B; --omr-soft:#3A1F25; --omr-line:#6B2F39;
    --ok:#5BD19B; --ok-soft:#173226; --warn:#F2B451; --warn-soft:#352812;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14161B; --sheet:#1C1F26; --ink:#ECEEF2; --ink-2:#B4B9C3;
  --pencil:#858B97; --line:#2C3039; --omr:#FF6B7B; --omr-soft:#3A1F25; --omr-line:#6B2F39;
  --ok:#5BD19B; --ok-soft:#173226; --warn:#F2B451; --warn-soft:#352812;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
img{max-width:100%;display:block}
.hidden{display:none !important}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--pencil)}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
nav a{padding:6px 12px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap}
nav a[aria-current="page"]{color:var(--omr);background:var(--omr-soft)}
main{max-width:1120px;margin:0 auto;padding:28px 20px 120px}
h1{font-family:var(--serif);font-weight:800;font-size:28px;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:700;font-size:20px;margin:32px 0 12px}
.lede{color:var(--ink-2);margin:0 0 24px;max-width:62ch}
.note{font-size:14px;color:var(--pencil)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:20px}

/* controls */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-size:14px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=number],select,textarea{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
textarea{resize:vertical;min-height:72px;font-family:var(--sans);letter-spacing:.08em}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:var(--pencil)}
.btn.primary{background:var(--omr);border-color:var(--omr);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--omr)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:5px;accent-color:var(--omr);width:16px;height:16px}

/* start panel */
.start{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:start}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:700px){.grid4,.stats4{grid-template-columns:1fr 1fr}}
.stack{display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{border-left:3px solid var(--omr-line);padding:2px 0 2px 12px}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:800;line-height:1.2}
.stat span{font-size:13px;color:var(--pencil)}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:28px;align-items:start}
.exam-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.q{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;margin-bottom:16px;scroll-margin-top:84px}
.q.current{border-color:var(--omr-line)}
.qimg{position:relative}
.one #qs .q{display:none}
.one #qs .q.current{display:block}
html.noscroll,html.noscroll body{overflow:hidden;overscroll-behavior:none;height:100%}
.one #qs .q{margin-bottom:0}
.one #qs .q.current .qimg{display:flex;justify-content:center}
.one #qs .qimg img{width:auto;max-width:100%;max-height:var(--qmax,65vh)}
/* focus layout for one-question mode */
.focusbar{display:none}
html.noscroll .focusbar{display:flex;position:fixed;top:0;left:0;right:0;z-index:9;height:calc(48px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 10px 0;align-items:center;gap:8px;background:var(--sheet);border-bottom:1px solid var(--line)}
.fb-mid{flex:1;text-align:center;font-size:14px;white-space:nowrap;overflow:hidden}
.fb-mid b{font-family:var(--serif);font-size:19px;color:var(--omr)}
.fb-timer{font-variant-numeric:tabular-nums;font-weight:600;margin:0 10px}
.fb-timer.over{color:var(--omr)}
.fb-right{display:flex;gap:6px;align-items:center}
.fb-right .btn{padding:6px 12px}
html.noscroll header,html.noscroll .omr,html.noscroll #mobilebar,html.noscroll .exam-head,html.noscroll .keyhelp{display:none !important}
html.noscroll.menu-open .exam-head{display:block !important;position:fixed;top:calc(54px + env(safe-area-inset-top,0px));right:10px;z-index:12;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:min(440px,94vw)}
html.noscroll.menu-open .exam-head h1{font-size:18px;margin-bottom:2px}
html.noscroll.menu-open .exam-head .tools{margin-top:10px}
html.noscroll main{max-width:none;padding:58px 8px 8px}
html.noscroll .exam{display:block}
html.noscroll #qs .q{border:0;background:none;padding:0}
html.noscroll .qtop{margin-bottom:4px}
html.noscroll .qtag{display:none}
html.noscroll .choices{justify-content:center;margin-top:10px}
html.noscroll .inkbar{position:fixed;top:calc(5px + env(safe-area-inset-top,0px));bottom:auto;left:6px;z-index:11;box-shadow:none;border:0;background:none;padding:0}
html.noscroll .inkbar button{width:36px;height:36px}
html.noscroll .qnav{width:44px;height:44px;font-size:28px;opacity:.85}
.qnav{position:fixed;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font-size:34px;line-height:1;display:grid;place-items:center;padding:0 0 4px;z-index:7;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.qnav:hover:not(:disabled){background:var(--omr);border-color:var(--omr);color:#fff}
.qnav:disabled{opacity:.3;cursor:default}
.qnav.prev{left:max(10px,env(safe-area-inset-left,0px))}
.qnav.next{right:max(10px,env(safe-area-inset-right,0px))}
@media (min-width:861px){.qnav.next{right:max(10px,calc((100vw - 1120px)/2 - 66px))}.qnav.prev{left:max(10px,calc((100vw - 1120px)/2 - 66px))}}
@media print{.qnav{display:none !important}}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply}
canvas.qnote{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply}
dialog.noteed{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;padding:0;display:none;flex-direction:column}
dialog.noteed[open]{display:flex}
.ne-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;border-bottom:1px solid var(--line);background:var(--sheet)}
.ne-bar .ne-title{font-size:14px;color:var(--ink-2);max-width:32ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ne-tools{display:flex;gap:2px;align-items:center}
.ne-tools button{width:38px;height:38px;border:0;border-radius:8px;background:none;display:grid;place-items:center;color:var(--ink-2);padding:0}
.ne-tools button[aria-pressed="true"]{background:var(--omr-soft);color:var(--omr)}
.ne-tools svg{width:20px;height:20px}
.ne-tools .sw{width:16px;height:16px;border-radius:50%}
.ne-body{flex:1;overflow:auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));background:var(--paper)}
.ne-wrap{position:relative;max-width:1000px;margin:0 auto;background:#fff;border-radius:6px;overflow:hidden}
.ne-wrap img{width:100%;height:auto;display:block}
#neCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;mix-blend-mode:multiply}
#neExpl{max-width:1000px;margin:14px auto 0}
.padarea{background:#fff;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#eef0f3 31px,#eef0f3 32px);border-top:1px dashed #d5d8de}
.padarea[style*="padding-top: 0"],.padarea:not([style]){border-top:0}
#neExpl:empty,#neExpl[hidden]{display:none}
body.drawing .ink{pointer-events:auto;touch-action:none;cursor:crosshair}
body.drawing.erasing .ink{cursor:cell}
.inkbar{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:center;gap:2px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.inkbar button{width:38px;height:38px;border:0;border-radius:8px;background:none;display:grid;place-items:center;color:var(--ink-2);padding:0}
.inkbar button:hover{background:var(--paper)}
.inkbar button[aria-pressed="true"]{background:var(--omr-soft);color:var(--omr)}
.inkbar svg{width:20px;height:20px}
.inkbar .sw{width:16px;height:16px;border-radius:50%}
.inkbar .sep{width:1px;height:24px;background:var(--line);margin:0 3px}
@media (max-width:860px){.inkbar{left:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px))}}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qnum{font-family:var(--serif);font-weight:800;font-size:20px;min-width:2ch}
.qtag{font-size:12px;color:var(--pencil)}
.flag{margin-left:auto;border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:13px;color:var(--ink-2)}
.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.qimg{background:#fff;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.qimg img{width:100%;height:auto}
.choices{display:flex;gap:10px;margin-top:14px}
.bub{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--omr);background:none;color:var(--omr);font-weight:600;font-size:16px;display:grid;place-items:center;transition:background .12s}
.bub[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

/* OMR card */
.omr{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--sheet);border:1.5px solid var(--omr);border-radius:6px;overflow:hidden}
.omr-head{background:var(--omr);color:#fff;padding:10px 14px}
.timer{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.timer.over{color:#FFE3E6}
.omr-head small{font-size:12px;opacity:.9}
.omr-rows{max-height:calc(100vh - 290px);overflow:auto;padding:4px 0}
.orow{display:grid;grid-template-columns:34px 1fr;align-items:center;border-bottom:1px solid var(--omr-line);padding:3px 10px 3px 0}
.orow:nth-child(5n){border-bottom:1.5px solid var(--omr)}
.orow .n{color:var(--omr);font-weight:700;font-size:13px;text-align:center;cursor:pointer}
.orow .bs{display:flex;gap:6px}
.ob{width:22px;height:30px;border-radius:11px;border:1px solid var(--omr);background:none;color:var(--omr);font-size:11px;font-weight:600;padding:0}
.ob[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:transparent}
.orow.flagged .n::after{content:"?";color:var(--warn);margin-left:1px}
.omr-foot{padding:12px;border-top:1.5px solid var(--omr);display:flex;flex-direction:column;gap:8px}
.mobilebar{display:none}

/* result */
.score{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin:10px 0 24px}
.score .big{font-family:var(--serif);font-weight:800;font-size:64px;line-height:1;color:var(--omr)}
.score .big span{font-size:28px;color:var(--ink-2)}
.marks{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-bottom:28px}
.mark{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:6px;height:52px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;text-decoration:none;color:var(--ink)}
.mark svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);overflow:visible}
.mark .fl{position:absolute;top:2px;right:5px;font-size:11px;color:var(--warn);font-family:var(--sans);font-weight:700}
.review{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.rcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px}
.rmeta{display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:10px;flex-wrap:wrap}
.pill{border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.pill.bad{background:var(--omr-soft);color:var(--omr)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.fl{background:var(--warn-soft);color:var(--warn)}
.expl-wrap{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.expl-wrap summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap}
.setrow > div:first-child{flex:1;min-width:220px}
.expl{white-space:pre-wrap;font-size:var(--expl-size,16px);line-height:1.75;color:var(--ink-2);margin-top:6px;max-width:72ch}
#zoomExpl{padding:12px 16px 16px;margin:0;border-top:1px solid var(--line)}
#zoomExpl:empty,#zoomExpl[hidden]{display:none}

/* add */
.drop{border:1.5px dashed var(--omr-line);border-radius:12px;padding:36px 20px;text-align:center;background:var(--sheet);cursor:pointer}
.drop.over{background:var(--omr-soft)}
.drop b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:4px}
.pending{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:16px}
.pcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pcard.missing{border-color:var(--warn)}
.pthumb{height:120px;background:#fff;border-radius:6px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in}
.pthumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.pthumb .tw{position:relative}
.pthumb .tw img{height:auto;object-fit:fill;display:block}
.pname{font-size:12px;color:var(--pencil);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:5px}
.mini .bub{width:30px;height:30px;font-size:13px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--omr);width:0;transition:width .2s}

/* manage */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.toolbar .field{min-width:150px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.mrow select{width:auto;padding:4px 8px}
.rate{font-weight:600}
.rate.hi{color:var(--omr)}

/* history */
.table-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--pencil);font-weight:600}
td.num{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--omr-soft)}

.empty{text-align:center;padding:48px 20px;color:var(--ink-2)}
.empty b{font-family:var(--serif);font-size:20px;display:block;color:var(--ink);margin-bottom:6px}

dialog{border:0;border-radius:12px;padding:0;max-width:min(920px,94vw);background:var(--sheet);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,16,.6)}
dialog .dimg{background:#fff;max-height:82vh;overflow:auto}
dialog .dbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;position:sticky;top:0;background:var(--sheet);z-index:1}
.znav{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(20,22,27,.72);color:#fff;font-size:34px;line-height:1;display:grid;place-items:center;padding:0 0 4px;z-index:2}
.znav:hover:not(:disabled){background:var(--omr)}
.znav:disabled{opacity:.25;cursor:default}
.znav.prev{left:max(12px,env(safe-area-inset-left,0px))}
.znav.next{right:max(12px,env(safe-area-inset-right,0px))}
.znav[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:8px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:860px){
  .start,.exam{grid-template-columns:1fr}
  .omr{display:none}
  .mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--omr);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;gap:14px}
  .mobilebar .timer{font-size:22px}
  .mobilebar .btn{margin-left:auto;background:#fff;color:var(--omr);border-color:#fff}
  h1{font-size:24px}
  .score .big{font-size:52px}
}
@media (max-width:520px){
  .grid2{grid-template-columns:1fr}
  .bar{padding:8px 14px;gap:10px}
  main{padding:20px 14px 120px}
  .review{grid-template-columns:1fr}
}
/* paper mode: answer entry only */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paper #qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-content:start}
.paper .q{margin:0;padding:12px 14px}
.paper .qimg{display:none}
.paper .choices{margin-top:6px}
.paper .qtop{margin-bottom:0}
.paper .q{cursor:pointer}
.paper .q.current{border:2px solid var(--omr);background:var(--omr-soft);padding:11px 13px}
.keyhelp{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin:-6px 0 16px}
.keyhelp kbd{display:inline-block;min-width:24px;text-align:center;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--sheet);font-family:var(--sans);font-size:13px;color:var(--ink)}
.print-head{display:none}
@media print{
  @page{size:A4;margin:8mm 7mm}
  body{background:#fff;color:#000}
  :root{padding:0}
  body::before,header,.omr,.mobilebar,.exam-head,.choices,.flag,.toast,.qtag,dialog{display:none !important}
  main{padding:0;max-width:none}
  .exam{display:block}
  .paper #qs{display:block}
  .paper .qimg{display:block}
  .print-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px;font-family:var(--serif)}
  .print-head b{font-size:20px}
  .print-head span{font-size:12px}
  #qs{column-count:2;column-gap:6mm;column-rule:1px solid #999}
  .print-1col #qs{column-count:1}
  .q{break-inside:avoid;border:0;border-radius:0;padding:0 0 6mm;margin:0;background:none}
  .qtop{margin-bottom:2px}
  .qnum{font-size:14px;color:#000}
  .qimg{border:0;border-radius:0}
}
@media print{.inkbar,.ink{display:none !important}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}
</style>

<header>
  <div class="bar">
    <div class="brand">기출 랜덤 모의고사 <small id="modeLabel"></small></div>
    <nav id="nav">
      <a href="#exam" data-view="exam">시험</a>
      <a href="#add" data-view="add">문제 등록</a>
      <a href="#manage" data-view="manage">문제 관리</a>
      <a href="#history" data-view="history">기록</a>
      <a href="#settings" data-view="settings">설정</a>
    </nav>
  </div>
</header>

<main id="app"><div class="empty"><b>불러오는 중</b>저장된 문제를 확인하고 있어요.</div></main>

<div class="mobilebar hidden" id="mobilebar">
  <div><div class="timer" id="mTimer">00:00</div><small id="mProg"></small></div>
  <button class="btn" id="mSubmit">제출</button>
</div>

<dialog id="zoom"><button class="znav prev" id="zPrev" aria-label="이전 문제" hidden>‹</button><button class="znav next" id="zNext" aria-label="다음 문제" hidden>›</button><div class="dbar"><span id="zoomTitle" class="note"></span><span style="display:flex;align-items:center;gap:8px"><button class="btn ghost" id="zExplBtn">해설 보기</button><button class="btn" id="zNote">필기하기</button><span id="zoomPos" class="note"></span><button class="btn ghost" onclick="document.getElementById('zoom').close()">닫기</button></span></div><div class="dimg"><div style="position:relative"><img id="zoomImg" alt=""><div id="zPad" class="padarea"></div><canvas class="qnote" id="zNoteCv"></canvas></div></div><div id="zoomExpl" class="expl"></div></dialog>
<dialog id="noteEd" class="noteed" aria-label="문제 필기">
  <div class="ne-bar">
    <div class="ne-tools">
      <button data-ntool="red" title="빨간 펜 (P)" aria-label="빨간 펜"><span class="sw" style="background:#E0283C"></span></button>
      <button data-ntool="blue" title="파란 펜 (U)" aria-label="파란 펜"><span class="sw" style="background:#1F5FD6"></span></button>
      <button data-ntool="black" title="검은 펜 (B)" aria-label="검은 펜"><span class="sw" style="background:#111;box-shadow:0 0 0 1px var(--line)"></span></button>
      <button data-ntool="hl" title="형광펜 (H)" aria-label="형광펜"><span class="sw" style="background:#FFD400;border-radius:3px;width:20px;height:10px"></span></button>
      <button data-ntool="eraser" title="지우개 (E)" aria-label="지우개"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M16 3l5 5-11 11H5l-2-2z"/><path d="M9 10l5 5"/><path d="M10 19h11"/></svg></button>
      <button data-nact="size" title="굵기 (S)" aria-label="굵기 바꾸기"></button>
      <button data-nact="undo" title="되돌리기 (Z)" aria-label="되돌리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button data-nact="clear" title="필기 모두 지우기" aria-label="필기 모두 지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    </div>
    <button class="btn ghost" data-nact="padplus" title="아래 여백 늘리기">여백 +</button>
    <button class="btn ghost" data-nact="padminus" id="nePadMinus" title="아래 여백 줄이기">여백 −</button>
    <span class="ne-title" id="neTitle"></span>
    <span style="flex:1"></span>
    <button class="btn ghost" data-nact="expl" id="neExplBtn">해설 보기</button>
    <span class="note" id="neSaved"></span>
    <button class="btn ghost" data-nact="prev" id="nePrev" aria-label="이전 문제">‹</button>
    <span class="note" id="nePos"></span>
    <button class="btn ghost" data-nact="next" id="neNext" aria-label="다음 문제">›</button>
    <button class="btn primary" data-nact="close">완료</button>
  </div>
  <div class="ne-body"><div class="ne-wrap"><img id="neImg" alt="문제 이미지"><div id="nePad" class="padarea"></div><canvas id="neCv"></canvas></div><div id="neExpl" class="expl"></div></div>
</dialog>

    const w = Math.round(bmp.width * scale), hgt = Math.round(bmp.height * scale);
    const c = document.createElement("canvas"); c.width = w; c.height = hgt;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,hgt); ctx.drawImage(bmp, 0, 0, w, hgt);
    let blob = await new Promise(r => c.toBlob(r, "image/webp", 0.95));
    if (!blob || blob.type !== "image/webp") blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.95));
    return blob && blob.size < file.size ? blob : file;
  } catch { return file; }
}

/* ---------- storage: cloud (db + assets) with IndexedDB fallback ---------- */
const S = { mode:null, questions:new Map(), settings:null, history:[], urls:new Map() };
const DEFAULT_SETTINGS = { subjects:["형사소송법","교정학"], manualSubjects:["국어","영어"], choices:4, count:25, minutes:25, weighted:true };
const SHARDS = 8;

const Cloud = {
  async init(){
    if (!window.claude || !window.claude.use) return false;
    try{
      const [db, assets, user] = await Promise.all([claude.use("db"), claude.use("assets"), claude.use("user")]);
      if (!db || !assets || !user) return false;
      const id = await user.id(); if (!id) return false;
      Object.assign(this, { db, assets, col: db.collection("data/users/" + id) });
      return true;
    } catch { return false; }
  },
  async load(){
    const snaps = await Promise.all(Array.from({length:SHARDS}, (_, k) => this.col.where("type","==","q").where("shard","==",k).get()));
    snaps.forEach(s => s.docs.forEach(d => S.questions.set(d.id, {id:d.id, ...d.data()})));
    const st = await this.col.doc("settings").get(); S.settings = {...DEFAULT_SETTINGS, ...(st.exists ? st.data() : {})};
    const hi = await this.col.doc("history").get(); S.history = hi.exists ? (hi.data().exams || []) : [];
  },
  img(q){ return "/_blob/" + q.img; },
  async add(blob, meta){
    const up = await this.assets.upload(blob);
    const id = "q" + uid36();
    const doc = { type:"q", shard: Math.floor(Math.random()*SHARDS), img: up.id, ...meta };
    await this.col.doc(id).set(doc);
    S.questions.set(id, {id, ...doc});
  },
  async update(id, patch){ await this.col.doc(id).update(patch); Object.assign(S.questions.get(id), patch); },
  async put(id, blob, meta){
    const old = S.questions.get(id);
    const up = await this.assets.upload(blob);
    const doc = { type:"q", shard: old && old.shard != null ? old.shard : Math.floor(Math.random()*SHARDS), img: up.id, ...meta };
    await this.col.doc(id).set(doc);
    if (old && old.img) { try { await this.assets.delete(old.img); } catch {} }
    S.questions.set(id, {id, ...doc});
  },
  async remove(id){
    const q = S.questions.get(id);
    try { await this.assets.delete(q.img); } catch {}
    await this.col.doc(id).delete(); S.questions.delete(id);
  },
  async saveSettings(){ await this.col.doc("settings").set(S.settings); },
  async saveHistory(){ await this.col.doc("history").set({ exams: S.history.slice(-300) }); }
};

const Local = {
  async init(){
    try{
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open("gichul-mock", 1);
        r.onupgradeneeded = () => { r.result.createObjectStore("q", {keyPath:"id"}); r.result.createObjectStore("kv"); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      return true;
    } catch { return false; }
  },
  tx(store, mode, fn){ return new Promise((res, rej) => { const t = this.idb.transaction(store, mode); const out = fn(t.objectStore(store)); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); },
  async load(){
    const all = await this.tx("q", "readonly", s => s.getAll());
    (all || []).forEach(q => S.questions.set(q.id, q));
    S.settings = {...DEFAULT_SETTINGS, ...((await this.tx("kv","readonly", s => s.get("settings"))) || {})};
    S.history = (await this.tx("kv","readonly", s => s.get("history"))) || [];
  },
  img(q){ if (!S.urls.has(q.id) && q.blob) S.urls.set(q.id, URL.createObjectURL(q.blob)); return S.urls.get(q.id) || ""; },
  async add(blob, meta){ const id = "q" + uid36(); const q = {id, type:"q", blob, ...meta}; await this.tx("q","readwrite", s => s.put(q)); S.questions.set(id, q); },
  async update(id, patch){ const q = Object.assign(S.questions.get(id), patch); await this.tx("q","readwrite", s => s.put(q)); },
  async put(id, blob, meta){ const q = {id, type:"q", blob, ...meta}; await this.tx("q","readwrite", s => s.put(q)); if (S.urls.has(id)){ URL.revokeObjectURL(S.urls.get(id)); S.urls.delete(id); } S.questions.set(id, q); },
  async remove(id){ await this.tx("q","readwrite", s => s.delete(id)); S.questions.delete(id); },
  async saveSettings(){ await this.tx("kv","readwrite", s => s.put(S.settings, "settings")); },
  async saveHistory(){ S.history = S.history.slice(-3000); await this.tx("kv","readwrite", s => s.put(S.history, "history")); }
};

/* ---------- weighting ---------- */
function weightOf(q, now){
  const n = q.n || 0;
  if (!n) return 2.5;
  const rate = (q.w || 0) / n;
  const days = q.lastAt ? (now - q.lastAt) / dayMs : 30;
  let w = 1 + 4 * rate + (q.last === 0 ? 3 : 0) + (q.last === 2 ? 1.5 : 0) + Math.min(days / 7, 2);
  if (days < 1 && q.last === 1) w *= 0.3;
  return w;
}
function pick(pool, count, weighted){
  const now = Date.now();
  return pool.map(q => ({ q, k: Math.pow(Math.random(), 1 / (weighted ? weightOf(q, now) : 1)) }))
    .sort((a, b) => b.k - a.k).slice(0, count).map(x => x.q);
}

document.addEventListener("keydown", e => {
  if (currentView() !== "exam" || !exam || exam.done) return;
  if (e.target.matches("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const pad = /^Numpad(\d)$/.exec(e.code);
  const n = pad ? +pad[1] : (/^\d$/.test(e.key) ? +e.key : NaN);
  const qc = (S.questions.get(exam.ids[curIdx]) || {}).choices || S.settings.choices;
  if (exam.paper){
    if (n >= 1 && n <= 5){ e.preventDefault(); if (n > qc) { toast(`${curIdx+1}번은 ${qc}지선다예요.`); return; } setAnswer(curIdx, n, true); }

async function submitExam(){
  const blank = exam.ids.length - Object.keys(exam.answers).length;
  if (AB.dir && AB.perm !== "granted") abEnsure(true);
  if (blank && !confirm(`표기하지 않은 문제가 ${blank}개 있어요. 그래도 제출할까요?`)) return;
  clearInterval(tick);
  const secs = Math.round((Date.now() - exam.startAt) / 1000);
  const items = exam.ids.map((id, i) => {
    const q = S.questions.get(id), mine = exam.answers[i] || null;
    return { id, i, mine, ans: q.answer, ok: !!mine && answersOf(q).includes(mine), flag: !!exam.flags[i] };
  });
  const correct = items.filter(x => x.ok).length;
  lastResult = { subject: exam.subject, items, correct, total: items.length, secs, limitSec: exam.limitSec };
  exam.done = true; ls.del("gm-exam");
  const finished = exam; exam = null;
  render(); window.scrollTo(0, 0);

  S.history.push({ at: Date.now(), subject: finished.subject, total: items.length, correct, secs, flagged: items.filter(x => x.flag).length,
    limitSec: finished.limitSec, ids: items.map(x => x.id), mine: items.map(x => x.mine || 0), ok: items.map(x => x.ok ? 1 : 0), fl: items.map(x => x.flag ? 1 : 0) });
  if (S.mode === "cloud") S.history.forEach((e, k) => { if (k < S.history.length - 100) { delete e.ids; delete e.mine; delete e.ok; delete e.fl; } });
  const now = Date.now();
  const jobs = items.map(x => () => {
    const q = S.questions.get(x.id); if (!q) return Promise.resolve();
    return Store.update(x.id, { n: (q.n||0) + 1, w: (q.w||0) + (x.ok ? 0 : 1), last: x.ok ? (x.flag ? 2 : 1) : 0, lastAt: now });
  });
  try{
    await Store.saveHistory();
    for (let k = 0; k < jobs.length; k += 4) await Promise.all(jobs.slice(k, k+4).map(f => f()));
    abWrite("records");
  } catch (err){ toast("기록 일부를 저장하지 못했어요. 연결을 확인해 주세요."); }
}

function refreshPending(){
  document.querySelectorAll(".pcard").forEach(card => {
    const p = pending[+card.dataset.k];

  });
  const filled = pending.filter(p => p.answer).length;
  $("#save").disabled = !filled; $("#save").textContent = `${filled}문제 등록`;
  $("#saveNote").textContent = pending.length - filled ? `정답이 없는 ${pending.length - filled}개는 등록되지 않아요.` : "";

function addFiles(list){
  const files = [...list].filter(f => f.type.startsWith("image/")).sort((a, b) => natSort(a.name, b.name));
  if (!files.length){ toast("이미지 파일만 올릴 수 있어요."); return; }
  files.forEach(f => pending.push({ file: f, name: f.name, url: URL.createObjectURL(f), answer: null }));
  renderAdd();
}
async function savePending(){
  const todo = pending.filter(p => p.answer);
  const btn = $("#save"); btn.disabled = true; $("#clear").disabled = true;
  const bar = $("#pbar"); bar.classList.remove("hidden");
  let done = 0, failed = 0; const base = Date.now();
  for (const p of todo){
    try{
      const blob = await compress(p.file);
      await Store.add(blob, { subject: addSubject, answer: p.answer, choices: S.settings.choices, tag: addTag.trim(), createdAt: base + done, n:0, w:0, last:null, lastAt:0 });
      p.saved = true;
    } catch (err){
      failed++;
      if (err && (err.code === "quota_exceeded")){ toast("저장 공간이 가득 찼어요. 쓰지 않는 문제를 지운 뒤 다시 시도하세요."); break; }
    }
    done++; bar.firstElementChild.style.width = (done / todo.length * 100) + "%";
    btn.textContent = `등록 중 ${done} / ${todo.length}`;
  }
  pending.filter(p => p.saved).forEach(p => URL.revokeObjectURL(p.url));
  if (todo.some(p => p.saved)) abWrite("full");
  pending = pending.filter(p => !p.saved);
  toast(failed ? `${done - failed}문제 등록, ${failed}문제 실패` : `${done}문제를 등록했어요.`);
  renderAdd();
}

/* ---------- manage view ---------- */
function importBatches(){
  const qs = [...S.questions.values()].filter(q => q.createdAt).sort((a, b) => a.createdAt - b.createdAt);
  const out = []; let cur = null, prev = 0;
  for (const q of qs){
    if (!cur || q.createdAt - prev > 5 * 60000){ cur = { key: String(q.createdAt), at: q.createdAt, ids: new Set() }; out.push(cur); }
    cur.ids.add(q.id); prev = q.createdAt;
  }
  return out.reverse();
}
const selected = new Set();
let manageLimit = 120, manageIds = [];
async function moveQuestions(ids, subject){
  let done = 0; const remap = new Map();
  for (const id of ids){
    const q = S.questions.get(id); if (!q || q.subject === subject) continue;
    try{
      if (S.mode === "local" && q.blob && q.src && id.startsWith("x")){
        const nid = importId(subject, q.src);
        if (nid !== id && !S.questions.has(nid)){
          const { id: _i, blob, ...meta } = q;
          await Store.put(nid, blob, { ...meta, subject });
          await Store.remove(id);
          remap.set(id, nid); done++; continue;
        }
      }
      await Store.update(id, { subject }); done++;
    } catch {}
  }
  if (remap.size){
    S.history.forEach(e => { if (e.ids) e.ids = e.ids.map(x => remap.get(x) || x); });
    try { await Store.saveHistory(); } catch {}
  }
  if (!S.settings.subjects.includes(subject)){ S.settings.subjects.push(subject); try { await Store.saveSettings(); } catch {} }
  return done;
}

/* ---------- drawing on questions ---------- */
let inkTool = null, lastInkIdx = null, penOnly = !!ls.get("gm-penonly");
const INK_STYLE = { red: { c: "#E0283C", w: 0.0032, a: 1 }, black: { c: "#111111", w: 0.0028, a: 1 }, blue: { c: "#1F5FD6", w: 0.003, a: 1 }, hl: { c: "#FFD400", w: 0.022, a: 0.45 } };
function setInkTool(t){

}
function inkNorm(cv, e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; }
function drawInk(i){

}
function eraseAt(i, pt, cv){
  const arr = exam.ink[i]; if (!arr || !arr.length) return;

  const keep = arr.filter(s => { for (let k = 0; k < s.p.length; k += 2){ const dx = (s.p[k] - pt.x) * r.width, dy = (s.p[k+1] - pt.y) * r.height; if (dx*dx + dy*dy < rad*rad) return false; } return true; });

}
function inkUndo(){
  const i = lastInkIdx != null && exam.ink[lastInkIdx] && exam.ink[lastInkIdx].length ? lastInkIdx : curIdx;
  if (exam.ink[i] && exam.ink[i].length){ exam.ink[i].pop(); drawInk(i); ls.set("gm-exam", exam); }
}
function setupInk(){
  exam.ink = exam.ink || {};
  document.querySelectorAll(".ink").forEach(cv => {
    const i = +cv.dataset.ink;
    const fit = () => {
      const r = cv.getBoundingClientRect(); if (!r.width || !r.height) return;
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(r.width * dpr), hh = Math.round(r.height * dpr);
      if (cv.width !== w || cv.height !== hh){ cv.width = w; cv.height = hh; }
      drawInk(i);
    };
    new ResizeObserver(fit).observe(cv.parentElement);
    let cur = null;
    cv.addEventListener("pointerdown", e => {
      if (!inkTool || e.button > 0) return;
      if (e.pointerType === "pen" && !penOnly){ penOnly = true; ls.set("gm-penonly", true); toast("펜이 감지됐어요. 이제 손가락으로는 스크롤하고 펜으로만 그려요."); }
      e.preventDefault(); cv.setPointerCapture(e.pointerId);

      cur = newStroke(inkTool, pt, e);

  });

  if (bar) bar.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;

    else if (b.dataset.act === "undo") inkUndo();
    else if (b.dataset.act === "size") cycleSize(inkTool === "hl" ? "hl" : "pen");
    else if (b.dataset.act === "clear"){ if (exam.ink[curIdx] && exam.ink[curIdx].length){ exam.ink[curIdx] = []; drawInk(curIdx); ls.set("gm-exam", exam); toast(`${curIdx+1}번 필기를 지웠어요.`); } }
  };
  setInkTool(inkTool);
}

/* ---------- saved notes per question (my annotated version) ---------- */

const SIZES = { pen: [0.55, 1, 1.6, 2.4], hl: [0.6, 1, 1.6] };

      ctx.beginPath(); ctx.moveTo(p[2*k-2] * W, p[2*k-1] * H); ctx.lineTo(p[2*k] * W, p[2*k+1] * H); ctx.stroke();

// draw only the newest segments of a stroke while it is being drawn (fast path)

function sizeIconHtml(tool){

  const d = [4, 7, 11, 16][penSize]; return `<span style="display:block;width:${d}px;height:${d}px;border-radius:50%;background:currentColor"></span>`;

  else { penSize = (penSize + 1) % SIZES.pen.length; ls.set("gm-pensize", penSize); toast(`펜 굵기: ${["가늘게", "보통", "굵게", "아주 굵게"][penSize]}`); }

function updateSizeIcons(){

    else if (act === "close") neClose();
  });
  d.addEventListener("cancel", e => { e.preventDefault(); neClose(); });
  d.addEventListener("keydown", e => {
    if (e.target.matches("input,textarea")) return;
    const k = e.key.toLowerCase();
    if (e.key === "ArrowLeft"){ e.preventDefault(); neStep(-1); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); neStep(1); }
    else if (k === "z" || ((e.ctrlKey || e.metaKey) && k === "z")){ e.preventDefault(); if (NE.strokes.length){ NE.strokes.pop(); neFit(); neQueueSave(); } }
    else if (k === "s"){ e.preventDefault(); cycleSize(NE.tool === "hl" ? "hl" : "pen"); }
    else if ({ p: "red", b: "black", u: "blue", h: "hl", e: "eraser" }[k]){ e.preventDefault(); neSetTool({ p: "red", b: "black", u: "blue", h: "hl", e: "eraser" }[k]); }
  });
})();

async function annotatedBlob(q){
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = Store.img(q); });
  const scale = Math.min(1, 2000 / img.naturalWidth);
  const w = Math.round(img.naturalWidth * scale), ih = Math.round(img.naturalHeight * scale);
  const pad = q.note && q.note.length ? Math.round((q.notePad || 0) * w) : 0;
  const c = document.createElement("canvas"); c.width = w; c.height = ih + pad;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, ih + pad); ctx.drawImage(img, 0, 0, w, ih);
  if (pad){ ctx.strokeStyle = "#d5d8de"; ctx.lineWidth = 1; ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(0, ih + 0.5); ctx.lineTo(w, ih + 0.5); ctx.stroke(); ctx.setLineDash([]); }
  ctx.globalCompositeOperation = "multiply"; paintStrokes(ctx, w, ih, q.note);
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
}
const EXT = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif", "image/bmp": "bmp" };

const annName = (q, k) => `${q.subject}_${String(q.src || q.no || (k + 1)).replace(/[\\/:*?"<>|\s]+/g, "_")}.jpg`;
async function gdSubFolder(parent, name){
  const q = encodeURIComponent(`name='${name}' and '${parent}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r = await (await gdApi(`drive/v3/files?q=${q}&fields=files(id)`)).json();
  if (r.files && r.files[0]) return r.files[0].id;
  return (await (await gdApi("drive/v3/files?fields=id", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, parents: [parent], mimeType: "application/vnd.google-apps.folder" }) })).json()).id;
}
async function gdUploadFile(folder, name, blob, mime, map){
  const id = map[name];
  const init = await gdApi(id ? `upload/drive/v3/files/${id}?uploadType=resumable` : "upload/drive/v3/files?uploadType=resumable", {
    method: id ? "PATCH" : "POST",
    headers: { "Content-Type": "application/json; charset=UTF-8", "X-Upload-Content-Type": mime },
    body: JSON.stringify(id ? {} : { name, parents: [folder], mimeType: mime })
  });
  const loc = init.headers.get("Location"); if (!loc) throw new Error("no upload url");
  const r = await fetch(loc, { method: "PUT", headers: { "Content-Type": mime }, body: blob });
  if (!r.ok){ const e = new Error("upload " + r.status); e.status = r.status; throw e; }
  map[name] = (await r.json()).id;
}

const xImp = { rows: null, fileName: "", subject: null, images: new Map() };
const fnv = str => { let x = 2166136261; for (const c of str) { x ^= c.codePointAt(0); x = Math.imul(x, 16777619) >>> 0; } return x.toString(36); };
const cleanText = v => String(v ?? "").replace(/\\n/g, "\n").replace(/\r\n?/g, "\n").trim();
function parseRow(r){
  const fn = String(r["파일명"] ?? "").trim();
  if (!fn) return null;
  const base = fn.replace(/\.[^.]+$/, "").toLowerCase();
  const content = cleanText(r["내용"]);
  const expl = cleanText(r["해설"]).replace(/^해설\s*/, "");
  const raw = String(r["정답"] ?? "").trim();
  const choices = /⑤/.test(content) || /⑤/.test(raw) ? 5 : 4;
  let answers = [...raw].map(ch => CIRC.indexOf(ch) + 1).filter(n => n > 0);
  if (!answers.length) { const d = raw.match(/[1-5]/g); if (d) answers = d.map(Number); }
  let noAnswer = false;
  if (!answers.length && /없음|전항|모두/.test(raw)) { noAnswer = true; answers = Array.from({length: choices}, (_, i) => i + 1); }
  answers = [...new Set(answers)].filter(n => n <= choices);
  const tm = content.match(/((?:19|20)\d{2}\.\s*\d급[^\n①]*)/);
  const nm = content.match(/^\s*(\d{1,4})\s/);
  return { fn, base, answers, noAnswer, choices, expl, tag: tm ? tm[1].trim().replace(/[,\s]+$/, "").slice(0, 60) : "", no: nm ? nm[1] : "" };
}
const MIME = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", gif: "image/gif", bmp: "image/bmp" };
async function loadZips(files){
  const btn = $("#zPick"); if (btn){ btn.disabled = true; btn.textContent = "압축 푸는 중…"; }
  let n = 0, sheet = null, bad = 0;
  for (const file of files){
    try{
      const zip = await JSZip.loadAsync(file);
      for (const f of Object.values(zip.files)){
        if (f.dir || /(^|\/)__MACOSX\//.test(f.name)) continue;
        const name = f.name.split("/").pop();
        if (!name || name.startsWith(".")) continue;
        const ext = (name.match(/\.([^.]+)$/) || [])[1]?.toLowerCase();
        if (MIME[ext]){
          const blob = await f.async("blob");
          xImp.images.set(name.replace(/\.[^.]+$/, "").toLowerCase(), new File([blob], name, { type: MIME[ext] }));
          n++;
          if (btn && n % 50 === 0) btn.textContent = `압축 푸는 중 ${n}장`;
        } else if (!sheet && /^(xlsx|xls|csv)$/.test(ext || "")){
          sheet = new File([await f.async("blob")], name);
        }
      }
    } catch { bad++; }
  }
  if (sheet && !xImp.rows) await loadSheet(sheet);
  toast(bad && !n ? "압축 파일을 열지 못했어요." : `이미지 ${n}장${sheet ? "과 엑셀 파일" : ""}을 불러왔어요.`);

}
async function loadSheet(file){

function importPlan(){

const importId = (subject, base) => "x" + fnv(subject) + "-" + base.replace(/[^A-Za-z0-9_.\-]/g, "_");

function backupNote(){
  const last = ls.get("gm-lastBackup");
  if (!S.questions.size) return "";
  if (!last) return "아직 백업한 적이 없어요.";
  const added = [...S.questions.values()].filter(q => (q.createdAt || 0) > last).length;
  const days = Math.floor((Date.now() - last) / dayMs);
  const when = days ? `${days}일 전` : "오늘";
  return added || days >= 7 ? `마지막 백업 ${when}${added ? `, 그 뒤로 추가한 문제 ${added}개` : ""}.` : "";
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
async function saveFile(filename, blob){
  const dl = window.claude && window.claude.use ? await claude.use("downloads") : null;
  if (dl) { await dl.save({ filename, data: blob }); return; }
  if (isIOS && navigator.canShare){
    try {
      const f = new File([blob], filename, { type: blob.type || "application/octet-stream" });
      if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: filename }); return; }
    } catch (err) { if (err && err.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function buildFullBackup(onProgress){

async function mergeSettingsHistory(data){
  if (data.settings){
    const subs = [...S.settings.subjects];
    (data.settings.subjects || []).forEach(x => { if (!subs.includes(x)) subs.push(x); });
    S.settings.subjects = subs;
    try { await Store.saveSettings(); } catch {}
  }
  if (Array.isArray(data.history)){
    const byAt = new Map(S.history.map(e => [e.at, e]));
    data.history.forEach(e => { const cur = byAt.get(e.at); if (!cur || (!cur.ids && e.ids)) byAt.set(e.at, e); });
    S.history = [...byAt.values()].sort((x, y) => x.at - y.at);
    try { await Store.saveHistory(); } catch {}
  }
}
async function applyRecords(rec, fullAt){
  const ids = new Set();
  for (const m of rec.questions || []){
    const { id, ...meta } = m; ids.add(id);
    if (S.questions.has(id)) { try { await Store.update(id, meta); } catch {} }
  }
  if (fullAt && rec.exportedAt > fullAt){
    for (const id of [...S.questions.keys()]) if (!ids.has(id)) { try { await Store.remove(id); } catch {} }
  }
  if (fullAt && rec.exportedAt > fullAt && Array.isArray(rec.history)){
    S.history = rec.history.slice(); try { await Store.saveHistory(); } catch {}
    rec = { ...rec, history: null };
  }
  await mergeSettingsHistory(rec);
}
async function importData(data, ask = true){
  if (!data || data.app !== "gichul-mock" || !Array.isArray(data.questions)) { toast("이 프로그램의 백업 파일이 아니에요."); return false; }
  if (data.kind === "records"){
    if (ask && !confirm("기록 백업 파일이에요. 지금 있는 문제들의 풀이 기록과 시험 기록을 이 파일 내용으로 맞출까요?")) return false;
    await applyRecords(data, 0);
    toast("기록을 불러왔어요.");
    return true;
  }
  const same = data.questions.filter(q => S.questions.has(q.id)).length;
  if (ask && !confirm(`백업에 문제 ${data.questions.length}개가 들어 있어요.${same ? ` 이미 있는 ${same}개는 백업 내용으로 바뀌어요.` : ""} 불러올까요?`)) return false;
  let done = 0, failed = 0;
  for (const q of data.questions){
    try{
      const { id, image, ...meta } = q;
      const blob = await (await fetch(image)).blob();
      await Store.put(id, blob, meta);
    } catch { failed++; }
    done++;
    if (done % 20 === 0) toast(`불러오는 중 ${done} / ${data.questions.length}`);
  }
  await mergeSettingsHistory(data);
  if (ask) toast(failed ? `${done - failed}개를 불러왔고 ${failed}개는 실패했어요.` : `문제 ${done}개를 불러왔어요.`);
  return true;
}

/* ---------- auto backup to a folder (File System Access API) ---------- */
const AB = { supported: typeof window.showDirectoryPicker === "function", dir: null, perm: "none", busy: null, queued: null, pending: null, lastErr: "" };
const AB_FULL = "기출모의고사-문제.json", AB_REC = "기출모의고사-기록.json";
const mergeKind = (a, b) => a === "full" || b === "full" ? "full" : (a || b);
function ago(t){
  if (!t) return "아직 없음";
  const m = Math.floor((Date.now() - t) / 60000);
  return m < 1 ? "방금" : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.floor(m/60)}시간 전` : `${Math.floor(m/1440)}일 전`;
}
async function abInit(){
  if (!AB.supported) return;
  try { AB.dir = (await Local.tx("kv", "readonly", st => st.get("backupDir"))) || null; } catch { AB.dir = null; }
  if (AB.dir){ try { AB.perm = await AB.dir.queryPermission({ mode: "readwrite" }); } catch { AB.perm = "prompt"; } }
}
async function abEnsure(interactive){
  if (!AB.dir) return false;
  let p = "prompt";
  try { p = await AB.dir.queryPermission({ mode: "readwrite" }); } catch {}
  if (p !== "granted" && interactive){ try { p = await AB.dir.requestPermission({ mode: "readwrite" }); } catch {} }
  AB.perm = p;
  return p === "granted";
}
async function abAllow(){
  if (await abEnsure(true)){
    if (!S.questions.size && await abHasFiles()) { await abRestore(); return; }
    toast("자동 백업을 다시 시작해요.");
    const k = AB.pending; AB.pending = null; if (k) abWrite(k);
  } else toast("폴더 사용을 허용해야 자동 백업이 돼요.");

async function abUnlink(){

async function writeFile(dir, name, blob){

}
function abWrite(kind){
  gdWrite(kind);

  if (AB.busy){ AB.queued = mergeKind(AB.queued, kind); return AB.busy; }
  AB.busy = (async () => {
    try{
      if (!(await abEnsure(false))){ AB.pending = mergeKind(AB.pending, kind); return; }
      refreshBackupUI();
      if (kind === "full" || AB.pending === "full"){ await writeFile(AB.dir, AB_FULL, await buildFullBackup()); ls.set("gm-lastBackup", Date.now()); }
      await writeFile(AB.dir, AB_REC, buildRecordsBackup()); ls.set("gm-lastRec", Date.now());
      AB.pending = null; AB.lastErr = "";
    } catch (err){ AB.lastErr = "마지막 자동 백업에 실패했어요."; AB.pending = mergeKind(AB.pending, kind); }

/* ---------- Google Drive auto backup ---------- */
const GD_SCOPE = "https://www.googleapis.com/auth/drive.file";
const GD_FOLDER = "기출모의고사 백업", GD_REC = "기출모의고사-기록.json";
const gdChunkName = c => `기출모의고사-문제-${String(c + 1).padStart(2, "0")}.json`;
const GD = {
  clientId: ls.get("gd-client") || "", linked: !!ls.get("gd-linked"),
  token: null, exp: 0, folder: ls.get("gd-folder") || null,
  pending: ls.get("gd-pending") || null, busy: null, progress: "", lastErr: "", needLogin: false
};
(() => { const t = ls.get("gd-token"); if (t && t.exp > Date.now()) { GD.token = t.t; GD.exp = t.exp; } })();
const gdTokenOk = () => !!GD.token && GD.exp > Date.now() + 30000;
const gdRedirectUri = () => location.origin + location.pathname.replace(/index\.html$/, "");
function gdLogin(silent, after){
  if (!GD.clientId){ toast("클라이언트 ID를 먼저 입력하세요."); return; }
  const st = Math.random().toString(36).slice(2);
  ls.set("gd-state", st); ls.set("gd-return", currentView());
  if (after) ls.set("gd-after", after);
  const p = new URLSearchParams({ client_id: GD.clientId, redirect_uri: gdRedirectUri(), response_type: "token", scope: GD_SCOPE, include_granted_scopes: "true", state: st });
  if (silent) p.set("prompt", "none");
  location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + p.toString();
}
function gdParseReturn(){
  const raw = location.hash.slice(1);
  if (!/(^|&)(access_token|error)=/.test(raw)) return null;
  const p = new URLSearchParams(raw);
  const ok = p.get("state") && p.get("state") === ls.get("gd-state");
  let result = "error";
  if (ok && p.get("access_token")){
    GD.token = p.get("access_token");
    GD.exp = Date.now() + (Math.max(60, +p.get("expires_in") || 3600) - 60) * 1000;
    ls.set("gd-token", { t: GD.token, exp: GD.exp });
    const first = !GD.linked;
    GD.linked = true; ls.set("gd-linked", true); GD.needLogin = false;
    result = first ? "linked" : "refreshed";
  } else if (ok && /required/.test(p.get("error") || "")) { GD.needLogin = true; result = "need"; }
  else if (ok && p.get("error") === "access_denied") { result = "denied"; }
  history.replaceState(null, "", location.pathname + location.search + "#" + (ls.get("gd-return") || "exam"));
  return result;
}
async function gdApi(path, opt = {}){
  const r = await fetch("https://www.googleapis.com/" + path, { ...opt, headers: { ...(opt.headers || {}), Authorization: "Bearer " + GD.token } });
  if (!r.ok){ const e = new Error("drive " + r.status); e.status = r.status; throw e; }
  return r;
}
async function gdFolder(){
  if (GD.folder) return GD.folder;
  const q = encodeURIComponent(`name='${GD_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r = await (await gdApi(`drive/v3/files?q=${q}&fields=files(id)&spaces=drive`)).json();
  let id = r.files && r.files[0] && r.files[0].id;
  if (!id){
    id = (await (await gdApi("drive/v3/files?fields=id", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: GD_FOLDER, mimeType: "application/vnd.google-apps.folder" }) })).json()).id;
  }
  GD.folder = id; ls.set("gd-folder", id); return id;
}
async function gdList(folder){
  const q = encodeURIComponent(`'${folder}' in parents and trashed=false`);
  const r = await (await gdApi(`drive/v3/files?q=${q}&fields=files(id,name,modifiedTime,size)&pageSize=500`)).json();
  return r.files || [];
}
async function gdUpload(folder, name, blob, map){
  const id = map[name];
  const init = await gdApi(id ? `upload/drive/v3/files/${id}?uploadType=resumable` : "upload/drive/v3/files?uploadType=resumable", {
    method: id ? "PATCH" : "POST",
    headers: { "Content-Type": "application/json; charset=UTF-8", "X-Upload-Content-Type": "application/json" },
    body: JSON.stringify(id ? {} : { name, parents: [folder], mimeType: "application/json" })
  });
  const loc = init.headers.get("Location");
  if (!loc){ const e = new Error("no upload url"); e.status = 0; throw e; }
  const r = await fetch(loc, { method: "PUT", headers: { "Content-Type": "application/json" }, body: blob });
  if (!r.ok){ const e = new Error("upload " + r.status); e.status = r.status; throw e; }
  const j = await r.json(); map[name] = j.id;
}
async function gdChunkBlob(qs, c){
  const parts = ['{"app":"gichul-mock","kind":"full","version":1,"chunk":' + c + ',"exportedAt":' + Date.now() + ',"questions":['];
  for (let i = 0; i < qs.length; i++){
    const q = qs[i];
    const blob = q.blob || await (await fetch(Store.img(q))).blob();
    const { blob: _b, img: _i, shard: _s, ...meta } = q;
    parts.push((i ? "," : "") + JSON.stringify({ ...meta, image: await blobToDataURL(blob) }));
  }
  parts.push("]}");
  return new Blob(parts, { type: "application/json" });
}
async function gdPush(kind){
  let folder;
  try { folder = await gdFolder(); const files = await gdList(folder); var map = Object.fromEntries(files.map(f => [f.name, f.id])); var names = files.map(f => f.name); }
  catch (err){ if (err.status === 404){ GD.folder = null; ls.del("gd-folder"); } throw err; }
  if (kind === "full"){
    const qs = [...S.questions.values()].sort((a, b) => a.id < b.id ? -1 : 1);
    const per = 40, n = Math.ceil(qs.length / per);
    for (let c = 0; c < n; c++){
      GD.progress = `문제 ${c + 1}/${n} 묶음 저장 중`; refreshBackupUI();
      await gdUpload(folder, gdChunkName(c), await gdChunkBlob(qs.slice(c * per, (c + 1) * per), c), map);
    }
    for (const nm of names){ const m = nm.match(/^기출모의고사-문제-(\d+)\.json$/); if (m && +m[1] > n){ try { await gdApi(`drive/v3/files/${map[nm]}`, { method: "DELETE" }); } catch {} } }
    ls.set("gd-chunks", n); ls.set("gd-lastFull", Date.now());
  }
  GD.progress = "기록 저장 중"; refreshBackupUI();
  const metas = [...S.questions.values()].map(({ blob, img, shard, ...m }) => m);
  const rec = new Blob([JSON.stringify({ app: "gichul-mock", kind: "records", version: 1, exportedAt: Date.now(), chunks: ls.get("gd-chunks") || 0, settings: S.settings, history: S.history, questions: metas })], { type: "application/json" });
  await gdUpload(folder, GD_REC, rec, map);
  ls.set("gd-lastRec", Date.now());
}
function gdWrite(kind){
  if (S.mode !== "local" || !GD.linked) return;
  GD.pending = mergeKind(GD.pending, kind); ls.set("gd-pending", GD.pending);
  if (!gdTokenOk()){ refreshBackupUI(); return; }
  if (GD.busy) return;
  GD.busy = (async () => {
    try{
      while (GD.pending){
        const k = GD.pending; GD.pending = null; ls.set("gd-pending", null);
        try { await gdPush(k); }
        catch (err){ GD.pending = mergeKind(GD.pending, k); ls.set("gd-pending", GD.pending); throw err; }
      }
      GD.lastErr = "";
    } catch (err){
      if (err && err.status === 401){ GD.token = null; ls.del("gd-token"); GD.lastErr = "드라이브 연결 시간이 지났어요. 다시 연결하면 이어서 저장돼요."; }
      else GD.lastErr = navigator.onLine === false ? "인터넷이 연결되면 드라이브에 저장할게요." : "드라이브 백업에 실패했어요. 잠시 뒤 다시 시도해 주세요.";
    } finally { GD.busy = null; GD.progress = ""; refreshBackupUI(); }
  })();
}
window.addEventListener("online", () => { if (GD.pending) gdWrite(GD.pending); });
async function gdRestore(){
  if (!gdTokenOk()){ gdLogin(false, "restore"); return; }
  try{
    toast("구글 드라이브에서 복구하고 있어요…");
    const folder = await gdFolder(); const files = await gdList(folder);
    const recF = files.find(f => f.name === GD_REC);
    const chunks = files.filter(f => /^기출모의고사-문제-\d+\.json$/.test(f.name)).sort((a, b) => a.name.localeCompare(b.name));
    if (!recF && !chunks.length){ toast("드라이브에 백업이 아직 없어요."); return; }
    let minAt = Infinity;
    for (let k = 0; k < chunks.length; k++){
      GD.progress = `복구 중 ${k + 1}/${chunks.length}`; refreshBackupUI(); toast(`복구 중 ${k + 1}/${chunks.length}`);
      const data = await (await gdApi(`drive/v3/files/${chunks[k].id}?alt=media`)).json();
      minAt = Math.min(minAt, data.exportedAt || 0);
      await importData(data, false);
    }
    if (recF){ const rec = await (await gdApi(`drive/v3/files/${recF.id}?alt=media`)).json(); await applyRecords(rec, isFinite(minAt) ? minAt : 0); if (rec.chunks) ls.set("gd-chunks", rec.chunks); }
    GD.progress = ""; toast(`드라이브에서 문제 ${S.questions.size}개를 복구했어요.`);
    render();
  } catch (err){
    GD.progress = "";
    if (err && err.status === 401){ GD.token = null; ls.del("gd-token"); gdLogin(false, "restore"); return; }
    toast("드라이브에서 복구하지 못했어요."); refreshBackupUI();
  }
}
async function gdHasBackup(){
  try { const files = await gdList(await gdFolder()); return files.some(f => f.name === GD_REC); } catch { return false; }
}
function gdUnlink(){
  if (!confirm("구글 드라이브 백업 연결을 끊을까요? 드라이브에 있는 백업 파일은 그대로 남아요.")) return;
  try { if (GD.token) fetch("https://oauth2.googleapis.com/revoke?token=" + encodeURIComponent(GD.token), { method: "POST" }).catch(() => {}); } catch {}
  GD.linked = false; GD.token = null; GD.pending = null; GD.folder = null;
  ["gd-linked", "gd-token", "gd-pending", "gd-folder"].forEach(k => ls.del(k));
  refreshBackupUI();
}

    btns = `<button class="btn" data-gd="now" ${GD.busy ? "disabled" : ""}>지금 백업</button><button class="btn ghost" data-gd="restore">드라이브에서 복구</button><button class="btn ghost" data-gd="off">연결 끊기</button>`;
  }
  return `<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px"><div style="flex:1;min-width:240px"><b>구글 드라이브 백업</b><div class="note">${status}</div></div>${btns}</div>`;
}
function gdBannerHtml(){
  if (S.mode !== "local" || !GD.linked) return "";
  const row = (msg, btn, act) => `<div class="banner" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:200px">${msg}</span><button class="btn" data-gd="${act}">${btn}</button></div>`;
  if (!S.questions.size) return row("저장된 문제가 없어요. 구글 드라이브 백업에서 복구할 수 있어요.", "드라이브에서 복구", "restore");
  if (!gdTokenOk() && (GD.pending || GD.needLogin)) return row("구글 드라이브에 아직 저장하지 못한 기록이 있어요. 연결하면 바로 저장돼요.", "드라이브 연결", "login");
  if (GD.lastErr) return `<div class="banner">${GD.lastErr}</div>`;
  return "";
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-gd]"); if (!b) return;
  const act = b.dataset.gd;
  if (act === "save"){
    const v = ($("#gdClient") ? $("#gdClient").value : "").trim();
    if (!/\.apps\.googleusercontent\.com$/.test(v)){ toast("클라이언트 ID는 .apps.googleusercontent.com으로 끝나야 해요."); return; }
    GD.clientId = v; ls.set("gd-client", v); gdLogin(false, "link");
  }
  else if (act === "client"){ GD.clientId = ""; ls.del("gd-client"); refreshBackupUI(); }
  else if (act === "login") gdLogin(false, GD.pending ? "flush" : null);
  else if (act === "now") gdWrite("full");
  else if (act === "restore"){ if (!S.questions.size || confirm("드라이브 백업으로 복구할까요? 같은 문제는 백업 내용으로 바뀌고, 기록은 합쳐져요.")) gdRestore(); }
  else if (act === "off") gdUnlink();
});

(async function boot(){
  const gdRet = gdParseReturn();
  let ok = await Cloud.init();
  if (ok){
    try { Store = Cloud; S.mode = "cloud"; await Cloud.load(); }
    catch { ok = false; S.questions.clear(); }
  }
  if (!ok){
    Store = Local; S.mode = "local";
    if (!(await Local.init())){ $("#app").innerHTML = `<div class="empty"><b>저장소를 열 수 없어요</b>이 브라우저에서는 문제를 저장할 수 없어요.</div>`; return; }
    await Local.load();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  }
  $("#modeLabel").textContent = S.mode === "local" ? "이 브라우저에 저장" : "";
  if (S.mode === "local") await abInit();
  if (S.mode === "local" && GD.linked && GD.clientId && !gdRet && !gdTokenOk() && navigator.onLine !== false
      && (GD.pending || !S.questions.size) && Date.now() - (ls.get("gd-silent-at") || 0) > 120000){
    ls.set("gd-silent-at", Date.now());
    gdLogin(true, !S.questions.size ? "restore" : "flush");
    return;
  }
  render();
  if (S.mode === "local" && gdRet){
    const after = ls.get("gd-after"); ls.del("gd-after");
    if (gdRet === "denied") toast("구글 드라이브 연결을 취소했어요.");
    else if (gdRet === "need") toast("구글 드라이브에 다시 로그인해야 해요.");
    else if (gdRet === "linked" || gdRet === "refreshed"){
      if (after === "restore" || (!S.questions.size && await gdHasBackup())) { gdRestore(); return; }
      if (gdRet === "linked") toast("구글 드라이브를 연결했어요. 첫 백업을 저장하고 있어요.");
      gdWrite(gdRet === "linked" ? "full" : (GD.pending || "records"));
    }
    refreshBackupUI();
  }
  if (S.mode === "local" && !S.questions.size && AB.dir && AB.perm === "granted" && await abHasFiles()) abRestore();
})();
</script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});</script>
